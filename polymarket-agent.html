<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Polymarket AI Agent</title>
<style>
:root{--bg:#0b1020;--card:#121a2d;--muted:#91a0bd;--text:#f5f7fb;--line:#24304a;--good:#35d07f;--warn:#f6c85f;--bad:#ff6b6b;--accent:#7aa2ff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#080d19,#0e1527);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1200px;margin:auto;padding:18px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:24px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap}
button,.select{background:#17223a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 13px;cursor:pointer}
button:hover{border-color:#49618f}.primary{background:#315db8;border-color:#4e79d2}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.card{background:rgba(18,26,45,.92);border:1px solid var(--line);border-radius:14px;padding:14px}.k{color:var(--muted);font-size:12px}.v{font-size:23px;font-weight:750;margin-top:5px}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.panel{background:rgba(18,26,45,.94);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:12px}.ph{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.ph strong{font-size:15px}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:950px}th,td{padding:11px 12px;border-bottom:1px solid #202b42;text-align:left;font-size:13px;vertical-align:top}th{color:var(--muted);font-weight:600;position:sticky;top:0;background:#121a2d}.title{max-width:370px;line-height:1.35}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.buy{background:rgba(53,208,127,.14);color:var(--good)}.watch{background:rgba(246,200,95,.14);color:var(--warn)}.pass{background:rgba(145,160,189,.13);color:var(--muted)}
.bar{height:7px;background:#202b42;border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--accent)}
.small{font-size:11px;color:var(--muted)}.footer{color:var(--muted);font-size:11px;padding:18px 2px}.notice{padding:11px 13px;background:#111b31;border:1px solid #263a62;border-radius:10px;color:#c9d5ef;font-size:12px;line-height:1.55}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}.v{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><h1>🤖 Polymarket AI Agent</h1><div class="sub">V1 · 公開市場資料＋錯價掃描＋模擬交易</div></div>
<div class="actions"><button id="refresh" class="primary">↻ 更新市場</button><button id="demo">載入示範</button></div></div>
<div class="notice" style="margin-top:14px">目前是<strong>模擬模式</strong>。系統不會送出任何真實訂單。AI 機率目前以可解釋的市場訊號模型代替；下一階段再接新聞／LLM 與後端自動化。</div>
<div class="grid">
<div class="card"><div class="k">市場數量</div><div id="markets" class="v">—</div></div>
<div class="card"><div class="k">BUY 訊號</div><div id="buys" class="v good">—</div></div>
<div class="card"><div class="k">WATCH</div><div id="watch" class="v warn">—</div></div>
<div class="card"><div class="k">模擬資金</div><div id="bank" class="v">$10,000</div></div>
</div>
<div class="panel"><div class="ph"><strong>🎯 錯價機會</strong><span id="status" class="small">尚未更新</span></div>
<div class="tablewrap"><table><thead><tr><th>市場</th><th>YES</th><th>模型機率</th><th>Edge</th><th>流動性</th><th>訊號</th><th>理由</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<div class="panel"><div class="ph"><strong>📒 模擬交易</strong><span class="small">V1 僅記錄，不下單</span></div>
<div class="tablewrap"><table><thead><tr><th>時間</th><th>市場</th><th>方向</th><th>價格</th><th>倉位</th><th>狀態</th></tr></thead><tbody id="trades"><tr><td colspan="6" class="small">尚無模擬交易</td></tr></tbody></table></div></div>
<div class="footer">資料來源：Polymarket 公開市場資料。模型結果僅供研究與回測，不代表投資建議。真正實盤前必須加入 API 金鑰、風控、滑價、費用與人工停機機制。</div>
</div>
<script>
const API='https://gamma-api.polymarket.com/markets';
const demoData=[
{question:'Will Bitcoin be above $100,000 at year end?',outcomePrices:'["0.46","0.54"]',volumeNum:1250000,liquidityNum:480000},
{question:'Will the Fed cut rates at the next meeting?',outcomePrices:'["0.62","0.38"]',volumeNum:840000,liquidityNum:310000},
{question:'Will a major AI model launch before November?',outcomePrices:'["0.31","0.69"]',volumeNum:390000,liquidityNum:120000},
{question:'Will US inflation be below 3% next release?',outcomePrices:'["0.57","0.43"]',volumeNum:270000,liquidityNum:95000}
];
let data=[];
const fmt=n=>n>=1e6?'$'+(n/1e6).toFixed(1)+'M':n>=1e3?'$'+(n/1e3).toFixed(0)+'K':'$'+Math.round(n||0);
function score(m){
 let p=Array.isArray(m.outcomePrices)?Number(m.outcomePrices[0]):Number(JSON.parse(m.outcomePrices||'[0.5]')[0]);
 if(!isFinite(p))p=.5;
 const liq=Number(m.liquidityNum||m.liquidity||0);
 const vol=Number(m.volumeNum||m.volume||0);
 const depth=Math.min(1,Math.log10(Math.max(10,liq))/7);
 const activity=Math.min(1,Math.log10(Math.max(10,vol))/7);
 // Conservative V1 prior: pull toward 50%, only flag meaningful dislocations.
 const model=Math.max(.05,Math.min(.95,.5 + (p-.5)*(0.72+0.18*activity) + (depth-.5)*.035));
 const edge=model-p;
 const signal=Math.abs(edge)>=.075 && liq>=50000 ? 'BUY' : Math.abs(edge)>=.04 ? 'WATCH':'PASS';
 const reason=signal==='BUY'?'價格與模型估值偏離，且流動性達門檻':signal==='WATCH'?'有偏離，但需要新聞/事件確認':'目前沒有足夠 Edge';
 return {m,p,model,edge,liq,vol,signal,reason};
}
function render(){
 const scored=data.map(score).filter(x=>x.m.question||x.m.title).sort((a,b)=>Math.abs(b.edge)-Math.abs(a.edge)).slice(0,30);
 document.getElementById('markets').textContent=data.length;
 document.getElementById('buys').textContent=scored.filter(x=>x.signal==='BUY').length;
 document.getElementById('watch').textContent=scored.filter(x=>x.signal==='WATCH').length;
 document.getElementById('rows').innerHTML=scored.map(x=>{
  const title=(x.m.question||x.m.title||'未命名市場');
  const edge=(x.edge*100).toFixed(1);
  const cls=x.signal==='BUY'?'buy':x.signal==='WATCH'?'watch':'pass';
  return '<tr><td class="title">'+esc(title)+'</td><td>'+Math.round(x.p*100)+'%</td><td>'+Math.round(x.model*100)+'%</td><td class="'+(x.edge>0?'good':'bad')+'">'+(x.edge>0?'+':'')+edge+'%</td><td>'+fmt(x.liq)+'<div class="bar"><i style="width:'+Math.min(100,x.liq/5000)+'%"></i></div></td><td><span class="pill '+cls+'">'+x.signal+'</span></td><td class="small">'+x.reason+'</td></tr>';
 }).join('')||'<tr><td colspan="7" class="small">沒有符合條件的市場</td></tr>';
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function load(){
 const status=document.getElementById('status'); status.textContent='抓取中…';
 try{
  const u=API+'?limit=100&active=true&closed=false&order=volume24hr&ascending=false';
  const r=await fetch(u); if(!r.ok)throw Error('HTTP '+r.status);
  const j=await r.json(); data=Array.isArray(j)?j:(j.markets||[]);
  if(!data.length)throw Error('無市場資料');
  status.textContent='已更新 '+new Date().toLocaleString('zh-TW');
 }catch(e){
  data=demoData; status.textContent='公開 API 暫時無法從瀏覽器讀取，已切換示範資料';
 }
 render();
}
document.getElementById('refresh').onclick=load;
document.getElementById('demo').onclick=()=>{data=demoData;document.getElementById('status').textContent='示範模式';render()};
load();
</script>
</body></html>
